# common/text_utils.py normalize_text()/normalize_label()이 실제 구현하는 규칙 문서화.
normalization:
  unicode_form: NFKC
  trim: true
  strip_internal_newlines: true
  bracket_normalization: true
  uppercase_ascii: true
  strip_all_whitespace_for_lookup: true

# undefined 라벨 추천(classify/recommend.py, 자동 확정에는 사용 안 함).
recommendation:
  similarity_method: char_ngram_cosine
  ngram_size: 2
  top_k: 3
  min_score: 15
  keyword_rules: []

# classifier/기동 검증 동작 스위치(모두 고정 true, 문서화 목적).
validation:
  exact_match_only: true
  undefined_on_no_match: true
  recommendation_does_not_classify: true
  reject_conflicting_mappings: true
  reject_unknown_instrument_keys: true
